<!doctype html>
<html lang="en" class="candy-root candy-scrollbar">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; script-src 'self';"
    >
    <title>THE JPEG ZONE</title>
    <meta name="og:image" content="https://jpeg.wavebeem.com/icon.jpg">
    <meta name="og:image:width" content="250">
    <meta name="og:image:height" content="250">
    <meta name="og:title" content="THE JPEG ZONE">
    <meta name="og:description" content="deep fried jpeg generator">
    <link rel="icon" sizes="16x16" href="/favicon.png">
    <style>
    @import "./candy.css" layer(candy);
    </style>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/jpeg-app.js"></script>
    <script
      defer
      data-domain="jpeg.wavebeem.com"
      src="/p/js/script.js"
    ></script>
  </head>
  <body class="box">
    <div class="box box-row box-align-start box-wrap gap3">
      <hgroup class="box gap1">
        <h1 class="margin0 title">THE JPEG ZONE</h1>
        <p class="margin0 subtitle">deep fried jpeg generator</p>
      </hgroup>
    </div>
    <jpeg-app class="box flex-auto">
      <div hidden id="progress-bar" class="progress-bar"></div>

      <div class="candy-card box">
        <p class="margin0">
          results will vary between browsers. try changing the settings,
          especially when you fry an image more than once. have fun!
        </p>
      </div>

      <form id="form">
        <fieldset id="fieldset" class="candy-card box">
          <input hidden id="file-input-real" type="file" accept="image/*">
          <div class="box gap0">
            <button
              id="file-input"
              class="candy-button candy-primary"
              type="button"
            >
              choose an image
            </button>
            <small class="margin-top2">supports drag/drop and copy/paste</small>
          </div>

          <div hidden id="file-input-container" class="candy-box"></div>

          <label class="box gap1"
            >how many times to fry
            <select id="fry-count" class="candy-select">
              <option value="100">100</option>
              <option value="50">50</option>
              <option value="25">25</option>
              <option value="10">10</option>
              <option value="5">5</option>
              <option value="4">4</option>
              <option value="3">3</option>
              <option value="2">2</option>
              <option value="1">1</option>
              <option value="0">0</option>
            </select>
          </label>

          <label class="box gap1"
            >fry quality per step (approximate)
            <select id="fry-quality" class="candy-select">
              <option value="0.01">1%</option>
              <option value="0.02">2%</option>
              <option value="0.03">3%</option>
              <option value="0.04">4%</option>
              <option value="0.05">5%</option>
              <option value="0.1">10%</option>
              <option value="0.2">20%</option>
              <option value="0.3">30%</option>
              <option value="0.4">40%</option>
              <option value="0.5">50%</option>
              <option value="0.6">60%</option>
              <option value="0.7">70%</option>
              <option value="0.8">80%</option>
              <option value="0.9">90%</option>
              <option value="1">100%</option>
            </select>
          </label>

          <label class="box gap1"
            >maximum image resolution
            <select id="fry-size" class="candy-select">
              <option value="0.0625">1&nbsp;&frasl;&nbsp;16 megapixels</option>
              <option value="0.125">1&nbsp;&frasl;&nbsp;8 megapixels</option>
              <option value="0.25">1&nbsp;&frasl;&nbsp;4 megapixels</option>
              <option value="0.5">1&nbsp;&frasl;&nbsp;2 megapixel</option>
              <option value="1">1 megapixel</option>
              <option value="Infinity">original</option>
            </select>
          </label>
        </fieldset>
      </form>

      <div id="output-area" class="box candy-card" hidden>
        <div class="box box-row gap2">
          <button id="fry-it-again" class="candy-button" type="button">
            fry it again
          </button>
          <a
            id="download-link"
            class="candy-button candy-primary flex-auto"
            href="#download"
            >download</a
          >
        </div>

        <div id="file-output-container" class="candy-box"></div>
      </div>

      <p class="margin0">
        &copy;
        <a class="candy-link" href="https://www.wavebeem.com"
          >sage fennel mock</a
        >
        &bull;
        <a
          href="https://github.com/wavebeem/the-jpeg-zone"
          target="github"
          class="candy-link"
          >source code on github</a
        >
      </p>
    </jpeg-app>
  </body>
</html>
